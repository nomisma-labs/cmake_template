# Template-owned. Jobs run in the CI image that cmake_template's ci_image.yml publishes.
name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test (${{ matrix.preset }})
    runs-on: ubuntu-26.04
    container: ghcr.io/${{ github.repository_owner }}/ci:latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ci]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure, build, test
        run: cmake --workflow --preset ${{ matrix.preset }}

  python_package:
    name: native Python wheel example
    runs-on: ubuntu-26.04
    container: ghcr.io/${{ github.repository_owner }}/ci:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Initialization removes the example. Derived repos add their own wheel tests.
      - name: Prepare optional Python packaging environment
        if: hashFiles('tests/integration/python_package/check.py') != ''
        run: |
          python3 -m venv build/python-env
          build/python-env/bin/python -m pip install -r tools/python_package_requirements.txt
      - name: Configure wheel integration test
        if: hashFiles('tests/integration/python_package/check.py') != ''
        run: >-
          cmake --preset ci -DCMAKE_TEMPLATE_TEST_PYTHON_PACKAGE=ON
          -DNOM_PYTHON_EXECUTABLE="$PWD/build/python-env/bin/python"
      - name: Build, install and import wheels
        if: hashFiles('tests/integration/python_package/check.py') != ''
        run: ctest --preset ci -R python_package --no-tests=error

  checks:
    name: headers, format, naming
    runs-on: ubuntu-26.04
    container: ghcr.io/${{ github.repository_owner }}/ci:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The checkout belongs to another user inside the container; the checks call git.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: python3 tools/check_python.py
      - run: python3 tools/check_headers.py
      - run: tools/check_format.sh
      - run: tools/check_naming.sh

  version:
    name: release tag matches project()
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_version.py "$GITHUB_REF_NAME"
